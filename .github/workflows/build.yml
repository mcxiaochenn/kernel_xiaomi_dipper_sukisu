name: Build and Release

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "SukiSU ref（commit SHA / 分支 / tag），留空用 builtin 分支"
        required: false
        default: ""
      clang_version:
        description: "AOSP Clang 版本"
        required: false
        default: "r487747c"
      release_tag:
        description: "发布 tag（如 v1.0.0），留空只出 artifact 不发布"
        required: false
        default: ""
      allow_rebuild:
        description: "允许重复构建（跳过『同 ref 已发布』检查）"
        type: boolean
        default: true
  schedule:
    # 每日检测 SukiSU builtin 分支更新，有新 commit 则自动构建并以 sukisu-<shortsha> 发布
    - cron: "23 4 * * *"

env:
  kernel_repository: PixelExperience-Devices/kernel_xiaomi_sdm845
  kernel_commit: d19207cbc0f2cbfe4be5e72d3d361f009205f37d
  device: dipper
  anykernel3_commit: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1

jobs:
  check_update:
    name: Check SukiSU update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ksu_ref: ${{ steps.resolve.outputs.ksu_ref }}
      ksu_short: ${{ steps.resolve.outputs.ksu_short }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve SukiSU ref and release decision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 定时任务：取 builtin 分支 HEAD
            ksu_ref=$(git ls-remote https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/builtin | cut -c1-40)
            release_tag="auto"
          else
            ksu_ref="${{ inputs.ksu_ref }}"
            [ -z "$ksu_ref" ] && ksu_ref="builtin"
            release_tag="${{ inputs.release_tag }}"
          fi

          # 解析成完整 SHA 并取短 sha（供发布命名与去重）
          full_sha=$(git ls-remote https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            "refs/heads/$ksu_ref" "refs/tags/$ksu_ref" | head -n1 | cut -c1-40)
          if [ -z "$full_sha" ] && echo "$ksu_ref" | grep -qE '^[0-9a-f]{7,40}$'; then
            full_sha="$ksu_ref"
          fi
          if [ -z "$full_sha" ]; then
            echo "::error::无法解析 SukiSU ref: $ksu_ref"
            exit 1
          fi
          ksu_short="${full_sha:0:8}"
          echo "ksu_ref=$full_sha" >> "$GITHUB_OUTPUT"
          echo "ksu_short=$ksu_short" >> "$GITHUB_OUTPUT"

          # 去重：最新 release 的 tag 已是该 ref 的 sukisu-<short> 时跳过
          latest_tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          should_build=true
          if [ "$latest_tag" = "sukisu-$ksu_short" ]; then
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.allow_rebuild }}" = "false" ]; then
              should_build=false
              echo "SukiSU $ksu_short 已发布过（tag=$latest_tag），跳过构建"
            fi
          fi

          # 自动构建统一用 sukisu-<short> 命名；手动构建用输入的 release_tag（可为空 = 只出 artifact）
          if [ "$release_tag" = "auto" ]; then
            release_tag="sukisu-$ksu_short"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build kernel
    needs: check_update
    if: needs.check_update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KSU_REF: ${{ needs.check_update.outputs.ksu_ref }}
      KSU_SHORT: ${{ needs.check_update.outputs.ksu_short }}
      RELEASE_TAG: ${{ needs.check_update.outputs.release_tag }}
    steps:
      - name: Set clang version
        run: echo "clang_version=${{ inputs.clang_version || 'r487747c' }}" | tee -a "$GITHUB_ENV"

      - name: "apt: Restore"
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-v1-${{ runner.os }}
          restore-keys: |
            apt-v1-${{ runner.os }}

      - name: Install packages
        run: |
          # 保留已下载的 .deb 供缓存复用（runner 镜像默认 docker-clean 会清掉）
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install -y \
              binutils-arm-linux-gnueabi \
              binutils-aarch64-linux-gnu \
              ccache \
              zip \
              python3
          # apt 装完会把 archives/partial 归给 root，归还给当前用户供 cache tar 打包
          sudo chown -R "$USER" /var/cache/apt/archives

      - name: "apt: Save"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_commit }}
          submodules: recursive

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo

      - name: Merge defconfig
        run: |
          cat arch/arm64/configs/dipper_defconfig \
              this-repo/config/ksu.fragment \
              > arch/arm64/configs/merged_defconfig
          echo "--- merged_defconfig 尾部 ---"
          tail -n 8 arch/arm64/configs/merged_defconfig

      - name: Setup SukiSU (integrate.sh)
        run: bash this-repo/scripts/integrate.sh . "$KSU_REF"

      - name: Apply kernel patches
        run: |
          for p in this-repo/patches/*.patch; do
            echo "Applying patch: $p"
            git apply -p1 "$p"
          done

      - name: "AOSP-Clang: Restore"
        id: aosp_clang_restore
        uses: actions/cache/restore@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "AOSP-Clang: Download"
        if: steps.aosp_clang_restore.outputs.cache-hit != 'true'
        run: |
          aosp_clang_branch=$(
              case "$clang_version" in
              r365631c ) echo android11-release;;
              r383902 | r416183b) echo master-kernel-build-2021 ;;
              r450784e) echo master-kernel-build-2022 ;;
              r487747c) echo main-kernel-build-2023 ;;
              *) echo main ;;
              esac
          )
          mkdir -p aosp-clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$aosp_clang_branch/clang-$clang_version.tar.gz" | tar xz -C aosp-clang

      - name: "AOSP-Clang: Save"
        if: steps.aosp_clang_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "ccache: Restore"
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.clang_version }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.clang_version }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache + PATH
        run: |
          mkdir -p ~/ccache-shim
          ln -sf "$(command -v ccache)" ~/ccache-shim/clang
          ln -sf "$(command -v ccache)" ~/ccache-shim/clang++
          echo "$HOME/ccache-shim" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_PATH=$GITHUB_WORKSPACE/aosp-clang/bin"
          } | tee -a "$GITHUB_ENV"

      - name: export flags
        run: |
          echo "flags=O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" | tee -a "$GITHUB_ENV"

      - name: Make defconfig
        run: make $flags merged_defconfig

      - name: Make
        run: |
          start_ts=$(date +%s)
          make $flags -j"$(nproc --all)"
          end_ts=$(date +%s)
          echo "build_seconds=$((end_ts - start_ts))" | tee -a "$GITHUB_ENV"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 构建信息"
            echo "- 内核: \`${{ env.kernel_repository }}@${{ env.kernel_commit }}\`"
            echo "- SukiSU: \`SukiSU-Ultra/SukiSU-Ultra@${KSU_SHORT}\`"
            echo "- Clang: \`${{ env.clang_version }}\`"
            echo "- 编译耗时: ${build_seconds:-?}s"
            echo ""
            echo '### ccache 统计'
            echo '```'
            ccache -s || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: AnyKernel3
        run: |
          curl -Lo AnyKernel3.zip "https://github.com/osm0sis/AnyKernel3/archive/${anykernel3_commit}.zip"
          unzip -q AnyKernel3.zip
          mv AnyKernel3-* AnyKernel3

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=PixelExperience dipper 14 (4.9.337) + SukiSU
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=dipper
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          (cd AnyKernel3 && rm -rf .git* README.md && zip -qr ../boot.zip .)

      - name: Repack boot.img
        run: |
          python3 this-repo/scripts/repack_boot.py \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk this-repo/ramdisk/ramdisk.cpio.gz \
            --header this-repo/ramdisk/boot_header.json \
            --output boot.img

      - name: SHA256SUMS
        run: |
          sha256sum boot.zip boot.img | tee SHA256SUMS

      - name: "ccache: Save"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.clang_version }}-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot
          path: |
            boot.zip
            boot.img
            SHA256SUMS

      - name: Check release tag not exists
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${RELEASE_TAG} 已存在，按约定不覆盖已发布产物"
            exit 1
          fi

      - name: Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            设备: ${{ env.device }} (Xiaomi Mi 8)
            ROM: PixelExperience 14.0 (20240317-0958) 内核 4.9.337

            内核源: https://github.com/${{ env.kernel_repository }}/tree/${{ env.kernel_commit }}
            SukiSU: https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/${{ env.KSU_REF }}
            Clang: ${{ env.clang_version }}
            编译耗时: ${{ env.build_seconds }}s

            产物:
            - `boot.zip` — AnyKernel3 卡刷包（recovery 刷入）
            - `boot.img` — 裸镜像（fastboot flash boot boot.img）
            - `SHA256SUMS` — 校验和
          files: |
            boot.zip
            boot.img
            SHA256SUMS
