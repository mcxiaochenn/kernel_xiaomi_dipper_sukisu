name: Build and Release (SUSFS / miui-20.9.4)

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "SukiSU ref（commit SHA / 分支 / tag），留空用 builtin 分支"
        required: false
        default: ""
      release_tag:
        description: "发布 tag（如 miui-20.9.4-susfs-v1.0.0），留空只出 artifact 不发布"
        required: false
        default: ""

env:
  kernel_repository: MiCode/Xiaomi_Kernel_OpenSource
  kernel_commit: dcfb1676925aec83b06ae04fd8ca989ced75067c
  kernel_defconfig: dipper_user_defconfig
  device: dipper
  anykernel3_commit: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
  # AOSP GCC 4.9 prebuilt（LineageOS 镜像；与 MIUI 原厂构建同款工具链时代）
  gcc_branch: lineage-18.1

jobs:
  build:
    name: Build kernel (SUSFS / miui-20.9.4)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve SukiSU ref
        id: resolve
        run: |
          set -euo pipefail
          ksu_ref="${{ inputs.ksu_ref }}"
          [ -z "$ksu_ref" ] && ksu_ref="builtin"
          full_sha=$(git ls-remote https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            "refs/heads/$ksu_ref" "refs/tags/$ksu_ref" | head -n1 | cut -c1-40)
          if [ -z "$full_sha" ] && echo "$ksu_ref" | grep -qE '^[0-9a-f]{7,40}$'; then
            full_sha="$ksu_ref"
          fi
          if [ -z "$full_sha" ]; then
            echo "::error::无法解析 SukiSU ref: $ksu_ref"
            exit 1
          fi
          {
            echo "ksu_ref=$full_sha"
            echo "ksu_short=${full_sha:0:8}"
          } >> "$GITHUB_ENV"

      - name: "apt: Restore"
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-v1-${{ runner.os }}
          restore-keys: |
            apt-v1-${{ runner.os }}

      - name: Install packages
        run: |
          # 保留已下载的 .deb 供缓存复用（runner 镜像默认 docker-clean 会清掉）
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install -y ccache zip python3
          # apt 装完会把 archives/partial 归给 root，归还给当前用户供 cache tar 打包
          sudo chown -R "$USER" /var/cache/apt/archives

      - name: "apt: Save"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_commit }}

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo

      - name: Merge defconfig
        run: |
          cat arch/arm64/configs/${{ env.kernel_defconfig }} \
              this-repo/config/ksu-susfs.fragment \
              > arch/arm64/configs/merged_defconfig
          echo "--- merged_defconfig 尾部 ---"
          tail -n 16 arch/arm64/configs/merged_defconfig

      - name: Setup SukiSU (integrate.sh)
        run: bash this-repo/scripts/integrate.sh . "$ksu_ref"

      - name: Apply kernel patches
        run: |
          for p in this-repo/patches/000*.patch this-repo/patches/susfs-*.patch; do
            echo "Applying kernel patch: $p"
            git apply -p1 "$p"
          done

      - name: Apply SukiSU patches
        run: |
          for p in this-repo/patches/ksu-*.patch; do
            echo "Applying SukiSU patch: $p"
            git -C KernelSU apply -p1 "$GITHUB_WORKSPACE/$p"
          done

      - name: "AOSP-GCC-4.9: Restore"
        id: aosp_gcc_restore
        uses: actions/cache/restore@v4
        with:
          path: aosp-gcc
          key: aosp-gcc-4.9-${{ env.gcc_branch }}

      - name: "AOSP-GCC-4.9: Download"
        if: steps.aosp_gcc_restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p aosp-gcc
          curl -L "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/${gcc_branch}.tar.gz" \
            | tar xz -C aosp-gcc --strip-components=1
          aosp-gcc/bin/aarch64-linux-android-gcc --version | head -n1

      - name: "AOSP-GCC-4.9: Save"
        if: steps.aosp_gcc_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aosp-gcc
          key: aosp-gcc-4.9-${{ env.gcc_branch }}

      - name: "ccache: Restore"
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-gcc49-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc49-
            ccache-${{ runner.os }}-

      - name: Setup ccache + PATH
        run: |
          mkdir -p "$HOME/.ccache"
          # GITHUB_PATH 逐行 prepend，后写的行最终排在 PATH 最前
          echo "$GITHUB_WORKSPACE/aosp-gcc/bin" >> "$GITHUB_PATH"
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_PATH=$GITHUB_WORKSPACE/aosp-gcc/bin"
          } | tee -a "$GITHUB_ENV"

      - name: export flags
        run: |
          echo "flags=O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-" | tee -a "$GITHUB_ENV"

      - name: Make defconfig
        run: make $flags CC="ccache aarch64-linux-android-gcc" merged_defconfig

      - name: Make
        run: |
          start_ts=$(date +%s)
          make $flags CC="ccache aarch64-linux-android-gcc" -j"$(nproc --all)"
          end_ts=$(date +%s)
          echo "build_seconds=$((end_ts - start_ts))" | tee -a "$GITHUB_ENV"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 构建信息（SUSFS 线 / miui-20.9.4）"
            echo "- ROM: MIUI 20.9.4 dev（Simplicity-Auto，内核 4.9.186-perf）"
            echo "- 内核: \`${{ env.kernel_repository }}@${{ env.kernel_commit }}\` (\`dipper-q-oss\`)"
            echo "- SukiSU: \`SukiSU-Ultra/SukiSU-Ultra@${ksu_short}\`"
            echo "- SUSFS: v2.4.0（内核树侧 patches/susfs-49-v2.4.0.patch，KSU 侧 builtin 自带）"
            echo "- 工具链: AOSP GCC 4.9（\`${gcc_branch}\`）"
            echo "- 编译耗时: ${build_seconds:-?}s"
            echo ""
            echo '### ccache 统计'
            echo '```'
            ccache -s || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Determine artifact names
        run: |
          KERNEL_RELEASE=$(cat out/include/config/kernel.release)
          KSU_DESC=$(git -C KernelSU describe --tags --always | tr '/' '-')
          BUILD_TS=$(date -u +%Y%m%d-%H%M)
          PREFIX="boot_dipper-${KERNEL_RELEASE}-sukisu-susfs-${KSU_DESC}-${BUILD_TS}Z"
          {
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "KSU_DESC=$KSU_DESC"
            echo "ARTIFACT_PREFIX=$PREFIX"
          } | tee -a "$GITHUB_ENV"

      - name: AnyKernel3
        run: |
          curl -Lo AnyKernel3.zip "https://github.com/osm0sis/AnyKernel3/archive/${anykernel3_commit}.zip"
          unzip -q AnyKernel3.zip
          mv AnyKernel3-* AnyKernel3

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=MIUI 20.9.4 dipper (4.9.186) + SukiSU + SUSFS
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=dipper
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          (cd AnyKernel3 && rm -rf .git* README.md && zip -qr "../${ARTIFACT_PREFIX}.zip" .)
          echo "Packed: ${ARTIFACT_PREFIX}.zip"

      - name: Repack boot.img
        run: |
          python3 this-repo/scripts/repack_boot.py \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk this-repo/ramdisk/ramdisk.cpio.gz \
            --header this-repo/ramdisk/boot_header.json \
            --output "${ARTIFACT_PREFIX}.img"
          ls -l "${ARTIFACT_PREFIX}.img"

      - name: SHA256SUMS
        run: |
          sha256sum "${ARTIFACT_PREFIX}.zip" "${ARTIFACT_PREFIX}.img" | tee SHA256SUMS

      - name: "ccache: Save"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-gcc49-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}.zip
            ${{ env.ARTIFACT_PREFIX }}.img
            SHA256SUMS

      - name: Check release tag not exists
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.release_tag }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ inputs.release_tag }} 已存在，按约定不覆盖已发布产物"
            exit 1
          fi

      - name: Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            分支: miui-20.9.4
            设备: ${{ env.device }} (Xiaomi Mi 8 / dipper)
            ROM: MIUI 20.9.4 dev（Simplicity-Auto 20200904，线刷底包 V12.5.2.0.QEACNXM）内核 ${{ env.KERNEL_RELEASE }}
            内核源: MiCode/Xiaomi_Kernel_OpenSource@dcfb1676 (dipper-q-oss)
            SukiSU: ${{ env.KSU_DESC }} (https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/${{ env.ksu_ref }})
            SUSFS: v2.4.0（内核树侧 patches/susfs-49-v2.4.0.patch，KSU 侧 builtin 自带）
            工具链: AOSP GCC 4.9
            编译耗时: ${{ env.build_seconds }}s

            文件命名: boot_dipper-<内核版本>-sukisu-susfs-<SukiSU版本>-<UTC时间戳>

            产物:
            - `${{ env.ARTIFACT_PREFIX }}.zip` — AnyKernel3 卡刷包（recovery 刷入）
            - `${{ env.ARTIFACT_PREFIX }}.img` — 裸镜像（fastboot flash boot）
            - `SHA256SUMS` — 校验和
          files: |
            ${{ env.ARTIFACT_PREFIX }}.zip
            ${{ env.ARTIFACT_PREFIX }}.img
            SHA256SUMS
